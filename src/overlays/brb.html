<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Be Right Back</title>
<!--
============================================================
   BE RIGHT BACK scene  (OBS Browser Source, 1920x1080, full-screen scene)
   Params: minutes (countdown "Back in"; leave out to count up "Away for"),
           msg, channel, accent, transparent
   Portrait screens / a vertical 1080x1920 canvas switch to a vertical layout automatically.
============================================================
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/brb.css">
</head>
<body class="solid">
<div class="stage">
  <div class="top rise">
    <div class="chip panel compact"><span class="dot"></span><b id="channel">yourchannel</b><span class="chip-label">paused</span></div>
    <div class="clock" id="clock"></div>
  </div>
  <main class="hero">
    <div class="kicker rise delay-1">Take five</div>
    <h1 class="rise delay-2">Be right <span class="highlight">back</span></h1>
    <p class="subtitle rise delay-2" id="msg">Stretching, snacking, or fixing something. Stay put.</p>
    <div class="count rise delay-3" id="count"></div>
  </main>
  <div class="marquee"><div class="marquee-track" id="marquee-track"></div></div>
</div>
<div class="hint">Params: ?minutes=5&amp;msg=Grabbing%20coffee&amp;channel=you</div>
<script type="module" src="../js/overlays/brb.js"></script>
</body>
</html>
