<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Webcam Scene</title>
<!--
============================================================
   WEBCAM scene overlay  (OBS Browser Source, 1920x1080, TRANSPARENT)
   Layer this ABOVE your webcam source. The frame is hollow so the camera shows through.
   Place/crop your webcam source to:   x=384  y=96   width=1152  height=648  (1920x1080 canvas)
   VERTICAL canvas (1080x1920) switches automatically: webcam source x=60 y=168 width=960 height=1200
   Params: name, title, channel, accent, bg=1 (checkerboard preview), solid (dark backdrop)
============================================================
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/webcam.css">
</head>
<body>
<div class="stage">
  <div class="cam"><span class="cam-corner"></span><span class="cam-corner"></span><span class="cam-corner"></span><div class="cam-badge"><span class="dot"></span>Live</div></div>
  <div class="plate">
    <div class="bar"></div>
    <div class="body panel"><h1 id="name">Your Name</h1><p id="title">Playing • Talking • Making</p></div>
  </div>
  <span id="channel" hidden></span>
</div>
<div class="hint">Params: ?name=Alex&amp;title=Variety%20streamer&amp;accent=FF4D8D · bg=1 for checkerboard</div>
<script type="module" src="../js/overlays/webcam.js"></script>
</body>
</html>
